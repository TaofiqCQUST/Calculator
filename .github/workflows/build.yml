name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Calculator.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: Calculator
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Calculator/app/build/outputs/apk/debug/app-debug.apk Calculator.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Calculator.apk --target "${{ github.sha }}" --title "Latest build" --notes "Debug APK built from the latest commit."
